[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qq-codex-bot"
version = "0.1.0"
description = "QQ official WebSocket/Webhook bridge to persistent Codex CLI conversations"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "httpx>=0.27,<1", "cryptography>=42,<48", "aiohttp>=3.9,<4", "Pillow>=10.4,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
qq-codex-bot = "qq_codex_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qq_codex_bot = ["templates/AGENTS.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

